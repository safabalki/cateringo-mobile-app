<ion-header collapse="fade" [translucent]="true" class="custom-header ion-no-border">
  <ion-toolbar>
    <ion-title>
      <p style="font-weight: 700; font-size: 1.1rem; color: #1a1a1a;">Profilim</p>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="ion-padding" *ngIf="content_loaded">
    
    <form [formGroup]="profileForm" (ngSubmit)="updateProfile()">
      <div class="section-card">
        <!-- Adreslerim Butonu (Resimdeki gibi kartın içinde en üstte ve kırmızı) -->
        <ion-button expand="block" fill="solid" routerLink="/secure/addresses" class="btn-addresses ion-margin-bottom">
          <ion-icon name="location" slot="start" style="font-size: 18px;"></ion-icon>
          ADRESLERİM
        </ion-button>

        <ion-list class="form-list" lines="none">
          <ion-item class="form-item">
            <ion-label position="stacked">Adınız</ion-label>
            <ion-input type="text" formControlName="ad"></ion-input>
          </ion-item>
  
          <ion-item class="form-item">
            <ion-label position="stacked">Soyadınız</ion-label>
            <ion-input type="text" formControlName="soyad"></ion-input>
          </ion-item>
  
          <ion-item class="form-item">
            <ion-label position="stacked">E-posta</ion-label>
            <ion-input type="email" formControlName="email" readonly="true"></ion-input>
          </ion-item>
  
          <ion-item class="form-item">
            <ion-label position="stacked">Telefon</ion-label>
            <ion-input type="tel" formControlName="telefon" placeholder="05XX XXX XX XX" maxlength="14" (ionInput)="formatPhone($event)"></ion-input>
          </ion-item>
          <div class="error-message" *ngIf="profileForm.get('telefon').invalid && profileForm.get('telefon').touched" style="color: var(--ion-color-danger); font-size: 0.8rem; margin-top: 4px; padding-left: 16px; font-weight: 500;">
            Lütfen geçerli bir telefon numarası giriniz (Örn: 05XX XXX XX XX).
          </div>
  
          <ion-item class="form-item">
            <ion-label position="stacked">Yeni Şifre</ion-label>
            <ion-input type="password" formControlName="sifre" placeholder="Boş bırakabilirsiniz"></ion-input>
          </ion-item>
        </ion-list>
  
        <!-- Bilgileri Güncelle Butonu (Kırmızı ve İnce, Köşeleri Yuvarlatılmış) -->
        <ion-button expand="block" type="submit" [disabled]="!profileForm.valid" class="btn-update-info ion-margin-top">
          Bilgileri Güncelle
        </ion-button>

      </div>
    </form>

    <!-- Çıkış Yap Butonu (Sayfanın En Altında Temiz Bir Buton) -->
    <div class="ion-text-center ion-margin-top-large" style="margin-top: 24px; margin-bottom: 16px;">
      <ion-button fill="clear" color="danger" (click)="signOut()" style="font-weight: 700; font-size: 0.9rem;">
        <ion-icon name="log-out-outline" slot="start" style="font-size: 18px;"></ion-icon>
        Oturumu Kapat
      </ion-button>
    </div>

  </div>

  <div *ngIf="!content_loaded" class="ion-padding">
    <ion-list>
      <ion-item *ngFor="let i of [1,2,3,4]">
        <ion-label>
            <h3><ion-skeleton-text animated style="width: 30%"></ion-skeleton-text></h3>
            <p><ion-skeleton-text animated style="width: 80%"></ion-skeleton-text></p>
        </ion-label>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
